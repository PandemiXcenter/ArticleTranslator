[project]
name = "article-translator"
version = "0.1.0"
description = "Page-preserving, schema-validated PDF translation pipeline"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.140.9",
    "google-genai>=2.14.0",
    "markitdown[pdf]>=0.1.6",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pypdf>=6.14.2",
    "pypdfium2>=5.12.1",
    "python-multipart>=0.0.32",
    "rich>=15.0.0",
    "typer>=0.27.0",
    "uvicorn>=0.51.0",
]

[project.scripts]
article-translator = "article_translator.cli:app"
app = "article_translator.cli:launch_app"

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
    "integration: exercises local PDF and filesystem adapters",
    "live: contacts an external service and is always opt-in",
]

[tool.coverage.run]
branch = true
source = ["article_translator"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["markitdown.*", "pypdfium2.*"]
ignore_missing_imports = true
